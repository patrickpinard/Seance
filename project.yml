# Description du projet Xcode, lue par XcodeGen (outils/generer-projet.sh).
# Seance.xcodeproj est généré : modifier ce fichier, pas le projet.
name: Seance

options:
  bundleIdPrefix: ch.patrick
  deploymentTarget:
    iOS: "26.0"
    tvOS: "26.0"
  developmentLanguage: fr
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    # Équipe personnelle de Patrick (compte Apple gratuit).
    DEVELOPMENT_TEAM: GATK475J3P
    # Version affichée dans À propos › Versions ; à changer avec Seance/Ecrans/Reglages/Versions.swift.
    MARKETING_VERSION: "4.2"
    CURRENT_PROJECT_VERSION: "27"

packages:
  SeanceKit:
    path: SeanceKit
  SeanceDonnees:
    path: SeanceDonnees
  SeanceNAS:
    path: SeanceNAS

targets:
  Seance:
    type: application
    platform: iOS
    sources:
      - Seance
      # Vues et ✓ des widgets, aussi affichés dans l'aperçu de test de l'app.
      - SeanceWidget/Partage
    dependencies:
      - package: SeanceKit
      - package: SeanceDonnees
      - package: SeanceNAS
      - target: SeanceWidget
    entitlements:
      path: Seance/Seance.entitlements
      properties:
        com.apple.security.application-groups:
          - group.ch.patrick.seance
    info:
      path: Seance/Info.plist
      properties:
        CFBundleDisplayName: Séance
        CFBundleDevelopmentRegion: fr
        # Siri ne rattache les phrases des raccourcis qu'à une langue que l'app déclare.
        CFBundleLocalizations:
          - fr
        # « Séance » est un mot courant, que Siri ne prend pas toujours pour un nom d'app : ces noms-là aussi sont acceptés
        # dans les phrases (« … avec Séance Ciné »).
        INAlternativeAppNames:
          - INAlternativeAppName: Séance Ciné
            INAlternativeAppNamePronunciationHint: séance ciné
          - INAlternativeAppName: Séance Cinéma
            INAlternativeAppNamePronunciationHint: séance cinéma
        # Une sauvegarde « .seance » (même JSON que « .json ») s'ouvre dans l'app : AirDrop, Fichiers, Mail.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: ch.patrick.seance.sauvegarde
            UTTypeDescription: Sauvegarde de Séance
            UTTypeConformsTo:
              - public.json
            UTTypeTagSpecification:
              public.filename-extension:
                - seance
        CFBundleDocumentTypes:
          - CFBundleTypeName: Sauvegarde de Séance
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes:
              - ch.patrick.seance.sauvegarde
        # Le Mac n'accepte que « sur place » : le fichier reçu est lu là où il est, sous accès protégé.
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Le fond du lancement : sombre, comme l'apparence d'origine.
        UILaunchScreen:
          UIColorName: FondLancement
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Format iPad, utilisé par la version Mac : toutes les orientations, fenêtre redimensionnable.
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - fetch
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - ch.patrick.seance.rafraichissement
          - ch.patrick.seance.programmes-tv
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: Séance lit ton NAS et met en route ton Apple TV, sur le réseau de la maison.
        NSBonjourServices:
          - _seance-config._tcp
        # Apps de lecture qui ouvrent les vidéos du NAS (EF-74).
        LSApplicationQueriesSchemes:
          - infuse
          - vlc-x-callback
        CFBundleURLTypes:
          - CFBundleURLName: ch.patrick.seance
            CFBundleURLSchemes:
              - seance
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.patrick.seance
        # iPhone, et Mac par Mac Catalyst (qui s'appuie sur l'interface iPad).
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: YES
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  # Séance sur Apple TV (EF-141) : la même logique par les trois paquets, une interface à part pour la télécommande.
  SeanceTV:
    type: application
    platform: tvOS
    sources:
      - SeanceTV
      # Couleurs et adresses d'images, communes à toutes les plateformes.
      - path: Seance/Design/Theme.swift
      # Données fictives et faux TMDB, pour relire les écrans dans le simulateur sans clé.
      - path: Seance/Etat/Demonstration.swift
      - path: Seance/Etat/FauxTMDB.swift
    dependencies:
      - package: SeanceKit
      - package: SeanceDonnees
      - package: SeanceNAS
      - target: SeanceTVEtagere
    entitlements:
      path: SeanceTV/SeanceTV.entitlements
      properties:
        # Espace partagé avec l'étagère du haut (EF-146).
        com.apple.security.application-groups:
          - group.ch.patrick.seance.tv
    info:
      path: SeanceTV/Info.plist
      properties:
        CFBundleDisplayName: Séance
        CFBundleDevelopmentRegion: fr
        CFBundleLocalizations:
          - fr
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIUserInterfaceStyle: Dark
        NSLocalNetworkUsageDescription: Séance lit ton NAS et met en route ton Apple TV, sur le réseau de la maison.
        NSBonjourServices:
          - _seance-config._tcp
        # Apps de lecture que Séance sait ouvrir sur l'Apple TV.
        LSApplicationQueriesSchemes:
          - infuse
          - vlc-x-callback
        # seance://film/603 : une affiche de l'étagère du haut ouvre sa fiche.
        CFBundleURLTypes:
          - CFBundleURLName: ch.patrick.seance.tv
            CFBundleURLSchemes:
              - seance
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.patrick.seance.tv
        TARGETED_DEVICE_FAMILY: "3"
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"

  # L'étagère du haut de l'écran d'accueil de l'Apple TV (EF-146).
  SeanceTVEtagere:
    type: tv-app-extension
    platform: tvOS
    sources:
      - SeanceTVEtagere
      - SeanceTV/Partage
    entitlements:
      path: SeanceTVEtagere/SeanceTVEtagere.entitlements
      properties:
        com.apple.security.application-groups:
          - group.ch.patrick.seance.tv
    info:
      path: SeanceTVEtagere/Info.plist
      properties:
        CFBundleDisplayName: Séance
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.tv-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ContentProvider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.patrick.seance.tv.etagere
        TARGETED_DEVICE_FAMILY: "3"
  SeanceWidget:
    type: app-extension
    platform: iOS
    sources:
      - SeanceWidget
    dependencies:
      - package: SeanceKit
      - package: SeanceDonnees
    entitlements:
      path: SeanceWidget/SeanceWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.ch.patrick.seance
    info:
      path: SeanceWidget/Info.plist
      properties:
        CFBundleDisplayName: Séance
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.patrick.seance.widget
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: YES
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO

  SeanceUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - SeanceUITests
    dependencies:
      - target: Seance
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.patrick.seance.uitests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Seance

schemes:
  SeanceTV:
    build:
      targets:
        SeanceTV: all
        SeanceTVEtagere: all
    run:
      config: Debug
  Seance:
    build:
      targets:
        Seance: all
        SeanceWidget: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SeanceUITests
