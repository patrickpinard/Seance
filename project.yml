# Description du projet Xcode, lue par XcodeGen (outils/generer-projet.sh).
# Seance.xcodeproj est généré : modifier ce fichier, pas le projet.
name: Seance

options:
  bundleIdPrefix: ch.patrick
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: fr
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    # Équipe personnelle de Patrick (compte Apple gratuit).
    DEVELOPMENT_TEAM: GATK475J3P
    # Version affichée dans À propos › Versions ; à changer avec Seance/Ecrans/Reglages/Versions.swift.
    MARKETING_VERSION: "1.4"
    CURRENT_PROJECT_VERSION: "7"

packages:
  SeanceKit:
    path: SeanceKit
  SeanceDonnees:
    path: SeanceDonnees
  SeanceNAS:
    path: SeanceNAS

targets:
  Seance:
    type: application
    platform: iOS
    sources:
      - Seance
      # Vues et ✓ des widgets, aussi affichés dans l'aperçu de test de l'app.
      - SeanceWidget/Partage
    dependencies:
      - package: SeanceKit
      - package: SeanceDonnees
      - package: SeanceNAS
      - target: SeanceWidget
    entitlements:
      path: Seance/Seance.entitlements
      properties:
        com.apple.security.application-groups:
          - group.ch.patrick.seance
    info:
      path: Seance/Info.plist
      properties:
        CFBundleDisplayName: Séance
        CFBundleDevelopmentRegion: fr
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Format iPad, utilisé par la version Mac : toutes les orientations, fenêtre redimensionnable.
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - fetch
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - ch.patrick.seance.rafraichissement
          - ch.patrick.seance.programmes-tv
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: Séance lit la liste des films et séries de ton NAS, sur le réseau de la maison.
        # Apps de lecture qui ouvrent les vidéos du NAS (EF-74).
        LSApplicationQueriesSchemes:
          - infuse
          - vlc-x-callback
        CFBundleURLTypes:
          - CFBundleURLName: ch.patrick.seance
            CFBundleURLSchemes:
              - seance
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.patrick.seance
        # iPhone, et Mac par Mac Catalyst (qui s'appuie sur l'interface iPad).
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: YES
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  SeanceWidget:
    type: app-extension
    platform: iOS
    sources:
      - SeanceWidget
    dependencies:
      - package: SeanceKit
      - package: SeanceDonnees
    entitlements:
      path: SeanceWidget/SeanceWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.ch.patrick.seance
    info:
      path: SeanceWidget/Info.plist
      properties:
        CFBundleDisplayName: Séance
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.patrick.seance.widget
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: YES
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO

  SeanceUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - SeanceUITests
    dependencies:
      - target: Seance
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.patrick.seance.uitests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Seance

schemes:
  Seance:
    build:
      targets:
        Seance: all
        SeanceWidget: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SeanceUITests
